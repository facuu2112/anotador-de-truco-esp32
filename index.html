<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotador de Truco</title>
    <style>
        body {
            background-color: #11381b;
            background-image: radial-gradient(circle at center, #1b4d29 0%, #11381b 100%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }
        h1 {
            color: #d4af37;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: lowercase;
            margin: 0;
        }
        .meta-indicator {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-top: 4px;
            text-transform: lowercase;
        }
        .board {
            display: flex;
            justify-content: center;
            gap: 60px;
            width: 100%;
            max-width: 800px;
            margin: auto;
        }
        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .team-title {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 1.5px;
            text-transform: lowercase;
            margin-bottom: 10px;
        }
        .score {
            font-size: 72px;
            font-weight: 300;
            color: #f8fafc;
            margin: 10px 0;
            font-family: "Times New Roman", Times, serif;
        }
        .btn-group {
            display: grid;
            grid-row: 1;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
            
        }
        .btn-subgroup {
            row-gap: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .btn {
            background-color: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            
        }
        .btn.add {
            background-color: #d4af37;
            color: #11381b;
            font-weight: bold;
            border: none;
        }
        .btn.falta {
            background-color: #b8860b;
            color: #fff;
            font-weight: bold;
            border: none;
            width: 100%;
            margin-top: 6px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-reset {
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
        }
        .btn-limit {
            background-color: #d4af37;
            border: none;
            color: #11381b;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
        }
        .btn-limit:hover {
            opacity: 0.9;
        }
        .btn-cancel {
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
            margin-top: 14px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: #1b4d29;
            border: 2px solid #d4af37;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 300px;
        }
        .modal-content h2 {
            color: #d4af37;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 8px;
        }
        .modal-content p {
            color: #cbd5e1;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div>
        <h1>anotador de truco</h1>
        <div class="meta-indicator" id="meta-display">a 30 puntos</div>
    </div>
    
    <div class="board">
        <div class="team">
            <div class="team-title">nosotros</div>
            <div class="score" id="score-nosotros">0</div>
            <div class="btn-group">
                <div class="btn-subgroup">
                <button class="btn" onclick="modificar('nosotros', -1)">-1</button>
                <button class="btn add" onclick="modificar('nosotros', 2)">truco</button>
                <button class="btn add" onclick="modificar('nosotros', 3)">retruco</button>
                <button class="btn add" onclick="modificar('nosotros', 4)">vale 4</button>
                </div>
                <div class="btn-subgroup">
                <button class="btn add" onclick="modificar('nosotros', 1)">+1</button>
                <button class="btn add" onclick="modificar('nosotros', 2)">envido </button>
                <button class="btn add" onclick="modificar('nosotros', 3)">real envido</button>
                <button class="btn add" onclick="faltaEnvido('nosotros')">falta envido</button>
                </div>
            </div>
        </div>
        
        <div class="team">
            <div class="team-title">ellos</div>
            <div class="score" id="score-ellos">0</div>
            <div class="btn-group">
                <div class="btn-subgroup">
                <button class="btn" onclick="modificar('nosotros', -1)">-1</button>
                <button class="btn add" onclick="modificar('nosotros', 2)">truco</button>
                <button class="btn add" onclick="modificar('nosotros', 3)">retruco</button>
                <button class="btn add" onclick="modificar('nosotros', 4)">vale 4</button>
                </div>
                <div class="btn-subgroup">
                <button class="btn add" onclick="modificar('nosotros', 1)">+1</button>
                <button class="btn add" onclick="modificar('nosotros', 2)">envido </button>
                <button class="btn add" onclick="modificar('nosotros', 3)">real envido</button>
                <button class="btn add" onclick="faltaEnvido('nosotros')">falta envido</button>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-reset" onclick="pedirConfirmacion()">juego nuevo</button>

    <div id="modal-confirmar" class="modal">
        <div class="modal-content">
            <h2>Reiniciar partida</h2>
            <p>Elegí a cuántos puntos jugar:</p>
            <div class="modal-buttons">
                <button class="btn-limit" onclick="confirmarReinicio(15)">a 15</button>
                <button class="btn-limit" onclick="confirmarReinicio(30)">a 30</button>
            </div>
            <button class="btn-cancel" onclick="cerrarModalConfirmar()">Cancelar</button>
        </div>
    </div>

    <div id="modal-ganador" class="modal">
        <div class="modal-content">
            <h2 id="ganador-texto">¡Hay Ganador!</h2>
            <p>¿Revancha a cuántos puntos?</p>
            <div class="modal-buttons">
                <button class="btn-limit" onclick="confirmarReinicio(15)">a 15</button>
                <button class="btn-limit" onclick="confirmarReinicio(30)">a 30</button>
            </div>
        </div>
    </div>

    <script>
        let nos = 0;
        let ell = 0;
        let meta = 30;

        function modificar(equipo, cantidad) {
            if (equipo === 'nosotros') {
                nos = Math.min(meta, Math.max(0, nos + cantidad));
                document.getElementById('score-nosotros').innerText = nos;
            } else {
                ell = Math.min(meta, Math.max(0, ell + cantidad));
                document.getElementById('score-ellos').innerText = ell;
            }
            verificarGanador();
            enviarServidor();
        }

        function faltaEnvido(equipo) {
            if (equipo === 'nosotros') {
                nos = meta;
                document.getElementById('score-nosotros').innerText = nos;
            } else {
                ell = meta;
                document.getElementById('score-ellos').innerText = ell;
            }
            verificarGanador();
            enviarServidor();
        }

        function verificarGanador() {
            if (nos >= meta) {
                document.getElementById('ganador-texto').innerText = "¡Ganó NOSOTROS!";
                document.getElementById('modal-ganador').style.display = 'flex';
            } else if (ell >= meta) {
                document.getElementById('ganador-texto').innerText = "¡Ganó ELLOS!";
                document.getElementById('modal-ganador').style.display = 'flex';
            }
        }

        function pedirConfirmacion() {
            document.getElementById('modal-confirmar').style.display = 'flex';
        }

        function cerrarModalConfirmar() {
            document.getElementById('modal-confirmar').style.display = 'none';
        }

        function confirmarReinicio(nuevaMeta) {
            meta = nuevaMeta;
            nos = 0;
            ell = 0;
            document.getElementById('meta-display').innerText = 'a ' + meta + ' puntos';
            document.getElementById('score-nosotros').innerText = nos;
            document.getElementById('score-ellos').innerText = ell;
            document.getElementById('modal-confirmar').style.display = 'none';
            document.getElementById('modal-ganador').style.display = 'none';
            enviarServidor();
        }

        function enviarServidor() {
            if (window.location.protocol.startsWith('http')) {
                const url = '/update?nosotros=' + nos + '&ellos=' + ell;
                fetch(url).catch(err => console.log('Sin conexión con ESP32'));
            }
        }

        window.addEventListener("load", pedirConfirmacion(30))
    </script>
</body>
</html>
